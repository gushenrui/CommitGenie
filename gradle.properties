# Gradle 构建 JVM 堆。平台 jar 数量多，符号解析 + Kotlin 编译都需要空间。
# 机器共 16GB，这里给 3GB，避免再次被 macOS 因内存压力终止（退出码 137）
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true

# Kotlin 编译器直接跑在 Gradle JVM 内，不额外启动 daemon 进程。
# 曾用 daemon 模式导致 Gradle 在 CountDownLatch 上无限等待（Kotlin daemon 起不来）
kotlin.compiler.execution.strategy=in-process
